server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

gateway:
  services:
    orders: ${ORDER_SERVICE_URL:http://localhost:8081}
    inventory: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    payments: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  jwt:
    # En Azure se define como secreto de Container Apps; este valor es solo para desarrollo local.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 1h
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    period: 1m
  demo-users:
    demo: ${DEMO_PASSWORD:demo123}
    ana: ${DEMO_PASSWORD:demo123}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
