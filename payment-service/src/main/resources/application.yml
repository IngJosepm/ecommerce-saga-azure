server:
  port: ${PORT:8083}

spring:
  application:
    name: payment-service
  config:
    import: optional:classpath:saga-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

payment:
  gateway:
    approval-limit: 1000                     # montos mayores se rechazan (tarjeta sin fondos)
    failure-rate: ${GATEWAY_FAILURE_RATE:0.0} # súbelo (ej. 0.8) para ver abrirse el Circuit Breaker
    slow-rate: ${GATEWAY_SLOW_RATE:0.0}
